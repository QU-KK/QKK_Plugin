<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uzima UI 生成器 — 面向 Blender 的拖拽式面板搭建工具</title>
<meta name="description" content="通过拖拽元素设计 Blender N 面板，编辑元素属性，并复制生成的 Uzima UI Python 代码。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
/* ===== YOUR LINKS: change these values, every button on the page follows ===== */
window.UZIMA_LINKS = {
  "superhive": "https://https://superhivemarket.com/products/uzima-blender-modern-ui/",
  "gumroad": "https://",
  "website": "https://",
  "support": "mailto:"
};
</script>
<style>:root{
  --bg:#121414;--s0:#1b1d20;--s1:#202125;--s2:#27292d;--s3:#323438;--s4:#3a3c40;--sel:#36383c;
  --text:#eef0f1;--dim:#b4b7ba;--muted:#7a7e83;--off:#55585c;
  --accent:#9fbd97;--accent-hi:#b6d0af;--accent-lo:#88a87f;--accent-edge:#5e7a57;--accent-text:#16200f;--accent-soft:rgba(159,189,151,.14);
  --info:#6aa8e8;--success:#5cc98a;--warning:#e8b25a;--danger:#ec6a6a;
  --line:transparent;
  --font:'Inter','Noto Sans SC',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;border:0 solid transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;background:none;outline:none}
button{cursor:pointer}
svg.ic{flex:none;display:block}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:9px}::-webkit-scrollbar-track{background:transparent}

/* ---------- app shell ---------- */
#app{display:grid;grid-template-rows:52px 1fr;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--s0)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:.2px}
.logo i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(160deg,var(--accent-hi),var(--accent-lo));color:var(--accent-text)}
.logo small{display:block;font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:0}
.hsp{flex:1}
.seg{display:flex;background:var(--s1);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:8px;color:var(--muted);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--s3);color:var(--text)}
.tb{height:32px;padding:0 12px;border-radius:9px;background:var(--s2);color:var(--dim);display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;transition:background .15s,color .15s}
.tb:hover{background:var(--s3);color:var(--text)}
.tb.ic1{width:32px;padding:0;justify-content:center}
.tb.hero{background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo));color:var(--accent-text);font-weight:650}
.tb.hero:hover{filter:brightness(1.06);color:var(--accent-text)}
.tb[disabled]{opacity:.4;pointer-events:none}
.field{height:32px;background:var(--s1);border-radius:9px;padding:0 10px;color:var(--text);min-width:0}
.field:focus{background:var(--s2);box-shadow:0 0 0 2px var(--accent-soft)}

main{display:grid;grid-template-columns:262px 1fr 372px;min-height:0}
aside{background:var(--s0);display:flex;flex-direction:column;min-height:0}
.pane-h{padding:12px 14px 8px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:8px}
#palette{overflow:auto;padding:4px 10px 18px;flex:1}
.psearch{margin:0 10px 6px;position:relative}
.psearch input{width:100%;padding-left:32px}
.psearch .ic{position:absolute;left:10px;top:9px;color:var(--muted)}
.grp{margin-top:10px}
.grp>h4{font-size:11px;color:var(--muted);font-weight:600;padding:6px 6px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.grp>h4 .ic{transition:transform .15s}
.grp.shut>h4 .ic{transform:rotate(-90deg)}
.grp.shut .items{display:none}
.items{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pi{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:10px;background:var(--s1);color:var(--dim);font-size:12px;font-weight:500;cursor:grab;user-select:none;touch-action:none;transition:background .12s,color .12s,transform .12s}
.pi:hover{background:var(--s3);color:var(--text)}
.pi:active{cursor:grabbing}
.pi .ic{color:var(--accent);opacity:.9}
.pi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- stage ---------- */
#stage{position:relative;overflow:auto;background:
  radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0) 0 0/22px 22px,var(--bg);display:flex;justify-content:center;padding:26px 20px 80px}
#stage .wrap{width:var(--pw,360px);flex:none;transition:width .2s}
.nframe{background:#1b1d1f;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.nbar{border-radius:14px 14px 0 0;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#151718;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.4px}
.nbar b{color:var(--dim);font-weight:650}
.nbar .tabs{display:flex;gap:2px;margin-left:auto}
.nbar .tabs i{font-style:normal;padding:3px 9px;border-radius:7px;background:var(--s2);color:var(--text)}
.nbar .tabs u{text-decoration:none;padding:3px 9px;opacity:.5}
#canvas{border-radius:0 0 14px 14px;padding:12px;min-height:420px;background:var(--bg);font-size:12.5px}
#canvas.floating{background:var(--s2)}
.hint{margin:14px auto 0;color:var(--muted);font-size:12px;text-align:center;max-width:360px}
.kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--s2);font:600 10.5px var(--mono);color:var(--dim)}

/* ---------- inspector ---------- */
.tabs-h{display:flex;gap:2px;padding:8px 10px 0}
.tabs-h button{flex:1;padding:9px 6px;border-radius:9px 9px 0 0;color:var(--muted);font-weight:600;font-size:12px;display:flex;justify-content:center;align-items:center;gap:6px;position:relative}
.tabs-h button.on{color:var(--text);background:var(--s1)}
.tabs-h button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:2px;border-radius:2px;background:var(--accent)}
#insp{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--s1);margin:0 10px 10px;border-radius:0 0 12px 12px}
.pane{display:none;flex:1;min-height:0;overflow:auto;padding:14px}
.pane.on{display:flex;flex-direction:column}
.empty{margin:auto;text-align:center;color:var(--muted);padding:20px}
.empty .ic{margin:0 auto 10px;opacity:.5}
.sel-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sel-title .badge{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.sel-title h3{font-size:14px;font-weight:650;line-height:1.2}
.sel-title small{color:var(--muted);font-size:11px}
.pr{margin-bottom:11px}
.pr>label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:550;margin-bottom:5px}
.pr>label em{font-style:normal;color:var(--off);font-weight:500}
.pr input[type=text],.pr input[type=number],.pr select,.pr textarea{width:100%;height:32px;background:var(--s0);border-radius:9px;padding:0 10px;color:var(--text)}
.pr textarea{height:auto;min-height:74px;padding:8px 10px;resize:vertical;line-height:1.5;font-size:12px}
.pr select{appearance:none;background-image:none;cursor:pointer}
.pr input:focus,.pr select:focus,.pr textarea:focus{background:var(--s2);box-shadow:0 0 0 2px var(--accent-soft)}
.pr .row2{display:flex;gap:6px}
.pr .row2>*{flex:1;min-width:0}
.pr input[type=color]{width:34px;height:32px;padding:0;border-radius:9px;background:var(--s0);cursor:pointer;flex:none}
.pr input[type=color]::-webkit-color-swatch-wrapper{padding:5px}.pr input[type=color]::-webkit-color-swatch{border-radius:6px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.tog span{font-size:12px;color:var(--dim)}
.sw{width:34px;height:20px;border-radius:20px;background:var(--s3);position:relative;transition:background .15s;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#cfd2d4;transition:transform .15s,background .15s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(14px);background:var(--accent-text)}
.iconpick{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:132px;overflow:auto;background:var(--s0);padding:6px;border-radius:10px;margin-top:6px}
.iconpick button{height:28px;border-radius:7px;color:var(--dim);display:grid;place-items:center}
.iconpick button:hover{background:var(--s3);color:var(--text)}
.iconpick button.on{background:var(--accent);color:var(--accent-text)}
details.adv{margin-top:6px;background:var(--s0);border-radius:11px;padding:2px 12px}
details.adv summary{cursor:pointer;padding:10px 0;font-size:12px;font-weight:600;color:var(--dim);list-style:none;display:flex;justify-content:space-between;align-items:center}
details.adv summary::-webkit-details-marker{display:none}
details.adv[open] summary{margin-bottom:4px}
.actions{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.actions .tb{flex:1;justify-content:center}
.tb.danger:hover{background:rgba(236,106,106,.16);color:var(--danger)}

/* ---------- layers ---------- */
.ly{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;color:var(--dim);font-size:12px;cursor:pointer}
.ly:hover{background:var(--s2)}.ly.on{background:var(--accent-soft);color:var(--accent-hi)}
.ly .ic{opacity:.8}.ly small{color:var(--muted);margin-left:auto;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- code ---------- */
.codebar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.codebar .seg{flex:1}.codebar .seg button{flex:1;justify-content:center;padding:5px 6px}
pre#code{flex:1;background:var(--s0);border-radius:12px;padding:14px;overflow:auto;font:11.5px/1.6 var(--mono);color:#d7dadc;tab-size:4;white-space:pre}
.tk-k{color:#c49aea}.tk-s{color:#9fbd97}.tk-n{color:#e8b25a}.tk-c{color:#6b7076;font-style:italic}.tk-f{color:#7fb6ee}.tk-d{color:#e8b25a}
.stat{font-size:11px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}

/* ---------- drag ---------- */
#ghost{position:fixed;z-index:999;pointer-events:none;padding:7px 12px;border-radius:10px;background:var(--accent);color:var(--accent-text);font-weight:650;font-size:12px;display:none;align-items:center;gap:7px;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translate(12px,12px)}
#drop{position:fixed;z-index:998;pointer-events:none;display:none;background:var(--accent);border-radius:4px;box-shadow:0 0 14px var(--accent)}
#dropbox{position:fixed;z-index:997;pointer-events:none;display:none;background:var(--accent-soft);border-radius:12px;box-shadow:0 0 0 2px var(--accent)}
body.dragging{cursor:grabbing;user-select:none}
body.dragging *{cursor:grabbing!important}

/* ---------- node chrome in canvas ---------- */
.n{position:relative;min-width:0;border-radius:9px}
.n>.pv{pointer-events:none}
.n:hover{box-shadow:0 0 0 1.5px rgba(159,189,151,.45)}
.n.sel{box-shadow:0 0 0 2px var(--accent)!important}
.n.ghosted{opacity:.35}
.n .tag{position:absolute;right:0;top:-22px;z-index:20;display:none;align-items:center;gap:2px;background:var(--accent);color:var(--accent-text);border-radius:8px 8px 0 0;padding:2px 3px 2px 8px;font-size:10.5px;font-weight:700;white-space:nowrap}
.n.sel>.tag{display:flex}
.tag button{width:20px;height:18px;border-radius:5px;color:var(--accent-text);display:grid;place-items:center}
.tag button:hover{background:rgba(0,0,0,.18)}
.kids{display:flex;flex-direction:column;gap:var(--g,8px);min-width:0}
.kids.row{flex-direction:row;align-items:center}
.kids.row>.n{flex:1 1 0}
.kids.row>.n.nat{flex:0 0 auto}
.kids.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));align-items:stretch}
.kids:empty::before,.kids>.ph{content:"把元素拖到这里"}
.kids:empty{min-height:46px;border-radius:9px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 8px,transparent 8px 16px);display:grid;place-items:center;color:var(--muted);font-size:11px}
.kids:empty::before{content:"把元素拖到这里"}

/* ---------- Uzima preview widgets ---------- */
.pv{color:var(--text);font-size:12.5px}
.u-card{background:var(--s1);border-radius:14px;padding:var(--p,12px)}
.u-card.raised{background:var(--s2)}
.u-card.outline{background:transparent;box-shadow:inset 0 0 0 1px var(--s3)}
.u-card.ghost{background:transparent}
.u-card.composer{background:var(--s1);box-shadow:0 0 0 1px var(--s3)}
.u-card.sh{box-shadow:0 6px 18px rgba(0,0,0,.28)}
.u-ch{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.u-ch .ib{width:28px;height:28px;border-radius:9px;background:var(--s3);display:grid;place-items:center;color:var(--dim);flex:none}
.u-ch .t{font-weight:650;font-size:13px;line-height:1.2}.u-ch .st{font-size:11px;color:var(--muted);line-height:1.3}
.u-ch .chev{margin-left:auto;color:var(--muted)}
.u-lbl{color:var(--text);display:flex;gap:6px;align-items:center;line-height:1.45}
.u-lbl.wrap{align-items:flex-start}
.u-head{display:block}.u-head .e{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--accent);font-weight:650;margin-bottom:2px}
.u-head .h{font-size:17px;font-weight:700;line-height:1.2}.u-head .s{font-size:12px;color:var(--muted);margin-top:2px}
.u-kv{display:flex;align-items:center;gap:8px;justify-content:space-between}.u-kv .k{color:var(--muted);display:flex;gap:6px;align-items:center}
.u-sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:600;padding:2px 0}
.u-sep::before,.u-sep::after{content:"";flex:1;height:1px;background:var(--s3)}
.u-sep.plain::before{display:none}
.u-code{background:var(--s0);border-radius:10px;padding:10px 12px;font:11px/1.6 var(--mono);color:#cfd3d6;white-space:pre-wrap;overflow:hidden}
.u-code .tt{display:flex;justify-content:space-between;color:var(--muted);font:600 10.5px var(--font);margin-bottom:6px}

.u-btn{height:var(--h,30px);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 13px;font-weight:600;font-size:12.5px;white-space:nowrap;background:var(--s3);color:var(--text);width:100%}
.u-btn.sm{--h:24px;font-size:11.5px;padding:0 10px}.u-btn.lg{--h:40px;font-size:13.5px;border-radius:11px}
.u-btn.primary{background:var(--accent);color:var(--accent-text)}
.u-btn.hero{background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo));color:var(--accent-text);border-radius:999px;box-shadow:0 4px 16px -4px var(--accent)}
.flat .u-btn.hero,.flat .u-btn.primary{background:var(--accent);box-shadow:none}
.noshadow .u-btn.hero,.noshadow .u-card.sh{box-shadow:none}
.u-btn.outline{background:transparent;box-shadow:inset 0 0 0 1px #4a4d52}
.u-btn.ghost{background:transparent;color:var(--dim)}
.u-btn.soft{background:var(--accent-soft);color:var(--accent-hi)}
.u-btn.danger{background:rgba(236,106,106,.16);color:var(--danger)}
.u-btn.success{background:rgba(92,201,138,.16);color:var(--success)}
.u-btn.off{opacity:.55}
.u-btn .cost{background:rgba(0,0,0,.18);border-radius:999px;padding:1px 8px;font-size:11px;display:flex;gap:4px;align-items:center}
.u-ibtn{width:var(--h,30px);height:var(--h,30px);border-radius:8px;display:grid;place-items:center;background:var(--s3);color:var(--dim)}
.u-ibtn.ghost{background:transparent}.u-ibtn.primary{background:var(--accent);color:var(--accent-text)}.u-ibtn.danger{background:rgba(236,106,106,.16);color:var(--danger)}.u-ibtn.soft{background:var(--accent-soft);color:var(--accent-hi)}
.u-ibtn.sm{--h:24px}.u-ibtn.lg{--h:40px}
.u-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;background:var(--s2);color:var(--dim);font-size:12px;font-weight:550;box-shadow:inset 0 0 0 1px var(--s3)}
.u-chip.on{background:var(--accent-soft);color:var(--accent-hi);box-shadow:inset 0 0 0 1px rgba(159,189,151,.5)}
.u-badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:650;background:var(--s3);color:var(--dim)}
.u-badge.accent{background:var(--accent-soft);color:var(--accent-hi)}.u-badge.info{background:rgba(106,168,232,.16);color:var(--info)}.u-badge.success{background:rgba(92,201,138,.16);color:var(--success)}.u-badge.warning{background:rgba(232,178,90,.16);color:var(--warning)}.u-badge.danger{background:rgba(236,106,106,.16);color:var(--danger)}
.u-badge .d{width:6px;height:6px;border-radius:50%;background:currentColor}

.u-chk{display:flex;gap:10px;align-items:flex-start}
.u-chk .bx{width:17px;height:17px;border-radius:5px;background:var(--s0);box-shadow:inset 0 0 0 1.5px #4a4d52;flex:none;margin-top:1px;display:grid;place-items:center;color:var(--accent-text)}
.u-chk.on .bx{background:var(--accent);box-shadow:none}
.u-chk .d{font-size:11px;color:var(--muted)}
.u-sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.u-sw .tr{width:34px;height:20px;border-radius:20px;background:var(--s3);position:relative;flex:none}
.u-sw .tr::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#cfd2d4}
.u-sw.on .tr{background:var(--accent)}.u-sw.on .tr::after{transform:translateX(14px);background:var(--accent-text)}
.u-rad{display:flex;flex-direction:column;gap:9px}.u-rad.h{flex-direction:row;flex-wrap:wrap;gap:14px}
.u-rad .it{display:flex;gap:10px;align-items:flex-start}
.u-rad .rb{width:17px;height:17px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #4a4d52;background:var(--s0);flex:none;margin-top:1px;display:grid;place-items:center}
.u-rad .it.on .rb{box-shadow:inset 0 0 0 1.5px var(--accent)}.u-rad .it.on .rb::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.u-rad .d{font-size:11px;color:var(--muted)}
.u-seg{display:flex;background:var(--s0);border-radius:10px;padding:3px;gap:2px}
.u-seg span{flex:1;text-align:center;height:24px;line-height:24px;border-radius:8px;color:var(--muted);font-weight:550;font-size:12px}
.u-seg span.on{background:var(--s3);color:var(--text)}
.u-tg{display:flex;flex-wrap:wrap;gap:5px}
.u-tg span{padding:0 11px;height:26px;line-height:26px;border-radius:8px;background:var(--s2);color:var(--dim);font-size:12px;font-weight:550}
.u-tg span.on{background:var(--accent-soft);color:var(--accent-hi)}
.u-rate{display:flex;gap:3px;color:var(--s4)}.u-rate .on{color:var(--warning)}

.u-lab{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:550}
.u-field{height:30px;border-radius:8px;background:var(--s0);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--text);box-shadow:inset 0 0 0 1px #2c2e32}
.u-field .ph{color:var(--off)}.u-field .ic{color:var(--muted)}
.u-field.ml{height:auto;align-items:flex-start;padding:8px 10px;line-height:1.5}
.u-field .x{margin-left:auto;color:var(--muted)}
.u-num{display:flex;justify-content:space-between;align-items:center;height:30px;border-radius:8px;background:var(--s0);padding:0 10px;box-shadow:inset 0 0 0 1px #2c2e32}

/* =====================================================================
   Document model
   ===================================================================== */
function mk(type, props={}, c=[]){
  const d = W[type];
  const p = {};
  d.props.forEach(x => p[x.k] = x.def);
  COMMON.forEach(x => { if(!(x.k in p)) p[x.k] = x.def; });
  Object.assign(p, props);
  const n = {id:nid(), type, p, c: c || []};
  if(type==='Tabs') n.ui = {tab:0};
  return n;
}
function mkTabs(){ return mk('Tabs',{},[mk('Tab',{label:'第一个',icon:'sparkle'}),mk('Tab',{label:'第二个',icon:'sliders'})]); }
function create(type){ return type==='Tabs' ? mkTabs() : mk(type); }
const meta0 = () => ({appId:'my_addon',tabName:'Uzima',panelTitle:'我的面板',mode:'sidebar',accent:'#9fbd97',gradients:true,shadows:true,width:360,palette:true});
let doc = {meta: meta0(), root: mk('Column',{gap:10,padding:0})};
let sel = null;

/* ---- tree helpers ---- */
function walk(n, f, parent=null, idx=0){ f(n,parent,idx); n.c.forEach((k,i)=>walk(k,f,n,i)); }
function find(id){ let r=null; walk(doc.root,(n,p,i)=>{ if(n.id===id) r={n,p,i}; }); return r; }
function isDesc(anc, id){ let f=false; walk(anc,(n)=>{ if(n.id===id) f=true; }); return f; }
function canAccept(parent, child){
  if(!W[parent.type].container) return false;
  if(parent.type==='Tabs') return child.type==='Tab';
  if(child.type==='Tab') return parent.type==='Tabs';
  return true;
}
function clone(n){ const c = JSON.parse(JSON.stringify(n)); walk(c,x=>{x.id=nid();}); return c; }

/* ---- history ---- */
let past=[], future=[], lastKey='', lastT=0;
const snap = () => JSON.stringify({doc, sel});
function commit(key=''){
  const t = Date.now();
  if(key && key===lastKey && t-lastT<700){ lastT=t; return; }
  lastKey=key; lastT=t;
  past.push(snap()); if(past.length>150) past.shift(); future=[];
  syncHistBtns();
}
function restore(s){ const o=JSON.parse(s); doc=o.doc; sel=find(o.sel||'')?o.sel:null; renderAll(); }
function undo(){ if(!past.length) return; future.push(snap()); restore(past.pop()); lastKey=''; syncHistBtns(); }
function redo(){ if(!future.length) return; past.push(snap()); restore(future.pop()); lastKey=''; syncHistBtns(); }
function syncHistBtns(){ $('#undo').disabled=!past.length; $('#redo').disabled=!future.length; }

/* =====================================================================
   Canvas rendering
   ===================================================================== */
function renderNode(n){
  const d = W[n.type];
  let inner;
  if(d.customKids) inner = d.render(n,'');
  else inner = d.render(n, n.c.map(renderNode).join(''));
  if(n.type==='Tab') return inner;
  const flex = n.p.flex;
  const nat = (flex===0) ? ' nat' : '';
  const st = [];
  if(flex>0 && flex!==1) st.push(`flex:${flex} 1 0`);
  if(n.p.width) st.push(`width:${n.p.width}px;flex:0 0 auto`);
  if(n.p.height_) st.push(`height:${n.p.height_}px`);
  const tag = `<div class="tag"><span>${esc(d.label)}</span><button data-act="up" title="上移">${ico('arrow_up',11,2.4)}</button><button data-act="down" title="下移">${ico('arrow_down',11,2.4)}</button><button data-act="dup" title="复制 (Ctrl+D)">${ico('copy',11,2.4)}</button><button data-act="del" title="删除 (Del)">${ico('trash',11,2.4)}</button></div>`;
  return `<div class="n${nat}${sel===n.id?' sel':''}" data-id="${n.id}" data-t="${n.type}" style="${st.join(';')}">${tag}${inner}</div>`;
}
function renderCanvas(){
  const c = $('#canvas');
  c.className = (doc.meta.gradients?'':'flat ')+(doc.meta.shadows?'':'noshadow ')+(doc.meta.mode==='window'?'floating':'');
  c.dataset.id = doc.root.id;
  c.innerHTML = `<div class="kids" data-kids="${doc.root.id}" style="--g:${doc.root.p.gap}px;padding:${doc.root.p.padding}px">${doc.root.c.map(renderNode).join('')}</div>`;
  document.documentElement.style.setProperty('--pw', doc.meta.width+'px');
  $('.nbar b').textContent = doc.meta.mode==='window' ? doc.meta.panelTitle : 'N 面板';
  $('.nbar .tabs').innerHTML = doc.meta.mode==='window' ? '' : `<u>条目</u><u>工具</u><i>${esc(doc.meta.tabName)}</i>`;
}
function setAccent(hex){
  doc.meta.accent = hex;
  const rgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const mix = (a,b,t) => '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('');
  const a = rgb(hex), lum = (0.2126*a[0]+0.7152*a[1]+0.0722*a[2])/255;
  const r = document.documentElement.style;
  r.setProperty('--accent',hex); r.setProperty('--accent-hi',mix(a,[255,255,255],.25)); r.setProperty('--accent-lo',mix(a,[0,0,0],.14));
  r.setProperty('--accent-edge',mix(a,[0,0,0],.4)); r.setProperty('--accent-text',lum>.45?'#16200f':'#ffffff');
  r.setProperty('--accent-soft',`rgba(${a.join(',')},.14)`);
}

const PYKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));

function pyv(v){

  if(typeof v==='number') return Number.isFinite(v)?String(v):'0';
  if(typeof v==='string') return JSON.stringify(v);

function genNode(n, ind, ctx){

    d.props.forEach(x=>{

      let v = p[x.k];
      if(x.t==='handler'){ if(v) kw[x.k] = {expr: ident(v)}; return; }
      if(x.skip0 && (!v)) return;
      if(x.skipNeg && v<0) return;
      if(x.skipFalse && !v) return;
      if(x.t==='list') v = lines(v);
      if(x.t==='nums') v = nums(v);
      if(x.t==='num') v = +v;
      if(x.expr && x.t==='text'){ if(v) kw[x.kw||x.k] = {expr:v}; return; }
      if(x.pos){ args.push(pyv(v)); return; }

      const ud = x.ud!==undefined ? x.ud : (['text','area','icon'].includes(x.t) ? '' : x.def);
      if(v === ud && !x.emit) return;

  d.props.forEach(x=>{ if(x.t==='handler' && p[x.k]) ctx.stubs.set(ident(p[x.k]), x.arg||''); });
  if(p.action){ ctx.actions.set(ident(p.action), {icon:p.icon||'', label:p.text||p.action}); }
  if(p.bind && !d.gen) kw.bind = p.bind;
  if(p.bind && d.gen && !kw.bind) kw.bind = p.bind;

  if(n.type==='Tabs'){
    const tabs = n.c.map(t=>`ui.Tab(${pyv(t.p.label)}, ${genNode({type:'Column',p:{gap:8,padding:0},c:t.c,id:t.id,_virtual:1},ind+2,ctx)}${t.p.icon?`, icon=${pyv(t.p.icon)}`:''})`);

  if(n.type!=='Tab'){

      if(x.k==='tooltip' && d.props.some(y=>y.k==='tooltip')){ if(v) kw.tooltip=v; return; }
      if(x.lambda){ if(v) kw[k] = {lambda:v}; return; }
      if(x.k==='gradient'||x.k==='shadows'){ if(v!=='theme') kw[k] = v==='on'; return; }
      if(x.k==='flex'){ if(+v===0){ if(!p.width) kw.width='auto'; } else if(v!==1) kw.flex = +v; return; }

      if(x.k==='key'){ if(v && !('key' in kw)) kw.key = v; return; }
      if(v) kw[k] = v;

  return call(name, args, ind);
}

function genCode(mode){

const drag = {on:false, src:null, type:null, id:null, x0:0, y0:0, target:null};

  const horiz = parent.type==='Row';

  let idx = kids.length, rect=null;

  const t = e.target;
  const tab = t.closest('[data-tab]');
  if(tab && tab.closest('#canvas')){ const [id,i]=tab.dataset.tab.split(':'); const r=find(id); r.n.ui={tab:+i}; select(id); renderCanvas(); return; }
  const act = t.closest('[data-act]');
  if(act){
    const a = act.dataset.act; const nel = act.closest('.n'); const id = nel?nel.dataset.id:sel;
    if(a==='del') del(id); else if(a==='dup') dup(id); else if(a==='up') move(id,-1); else if(a==='down') move(id,1);
    else if(a==='selparent'){ const r=find(sel); if(r&&r.p&&r.p!==doc.root) select(r.p.id); else select(null); }
    else if(a==='addtab'){ const r=find(sel); commit(); r.n.c.push(mk('Tab',{label:'标签页 '+(r.n.c.length+1)})); renderAll(); }
    else if(a==='deltab'){ const r=find(sel); if(r.p.c.length>1){ commit(); const pid=r.p.id; r.p.c.splice(r.i,1); r.p.ui={tab:0}; sel=pid; renderAll(); } else toast('标签视图至少需要一个标签页','info'); }
    return;
  }
  const nel = t.closest('#canvas .n');
  if(nel){ e.stopPropagation(); select(nel.dataset.id); return; }
  if(t.closest('#canvas') || t.id==='stage' || t.closest('.nframe')){ if(!t.closest('.tag')) select(null); }
  const ly = t.closest('.ly'); if(ly){ select(ly.dataset.id); setTab('layers'); return; }
  const gh = t.closest('.grp>h4'); if(gh){ const g=gh.parentElement.dataset.g; shut[g]=!shut[g]; gh.parentElement.classList.toggle('shut'); }
  const iop = t.closest('[data-iconopen]');
  if(iop){ const k=iop.dataset.iconopen; const box=$(`[data-ip="${k}"]`); if(box.hidden){ const cur=find(sel).n.p[k]; box.innerHTML=`<button data-ipick="" title="无">${ico('x',14)}</button>`+ICON_NAMES.map(i=>`<button data-ipick="${i}" class="${i===cur?'on':''}" title="${i}">${ico(i,14)}</button>`).join(''); box.hidden=false; } else box.hidden=true; return; }
  const ip = t.closest('[data-ipick]');
  if(ip){ const box=ip.closest('[data-ip]'); const k=box.dataset.ip; commit(); find(sel).n.p[k]=ip.dataset.ipick; renderInspector(); refresh(); return; }
  const sw = t.closest('[data-bool]');
  if(sw){ const k=sw.dataset.k; commit(); const n=find(sel).n; n.p[k]=!n.p[k]; sw.classList.toggle('on',n.p[k]); refresh(); return; }
  const sc = t.closest('[data-sw]'); if(sc){ setAccent(sc.dataset.sw); $$('.swatches i').forEach(i=>i.classList.toggle('on',i===sc)); $('#acc').value=sc.dataset.sw; renderAll(); }
});
document.addEventListener('dblclick', e=>{
  const pi=e.target.closest('.pi'); if(pi){ const r=sel&&find(sel); let tgt=doc.root.id; if(r){ tgt = W[r.n.type].container && r.n.type!=='Tab' && r.n.type!=='Tabs' ? r.n.id : (r.p?r.p.id:doc.root.id); if(r.n.type==='Tabs') tgt=r.n.c[Math.min(r.n.ui&&r.n.ui.tab||0,r.n.c.length-1)].id; } addTo(pi.dataset.type,tgt); }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.m){ const k=t.dataset.m; commit('m'+k); doc.meta[k]= k==='width'?+t.value:t.value; if(k==='mode'||k==='width'){ renderAll(); } else { refresh(); } return; }
  if(t.dataset.root){ commit('root'); doc.root.p.gap=+t.value||0; refresh(); return; }
  if(t.dataset.kc){ const k=t.dataset.kc; if(/^#[0-9a-f]{6}$/i.test(t.value)){ commit(sel+k); find(sel).n.p[k]=t.value; const c=$(`input[type=color][data-k="${k}"]`); if(c) c.value=t.value; refresh(); } return; }
  if(t.dataset.k && sel){
    const r=find(sel); if(!r) return; const k=t.dataset.k; commit(sel+k);
    let v=t.value; const pd=[...W[r.n.type].props,...COMMON].find(x=>x.k===k);
    if(pd&&pd.t==='num'){ v = v===''?pd.def:+v; }
    r.n.p[k]=v;
    if(pd&&pd.t==='color'){ const tx=$(`input[data-kc="${k}"]`); if(tx) tx.value=v; }
    refresh(); return;
  }
  if(t.id==='acc'){ commit('acc'); setAccent(t.value); renderAll(); }
  if(t.id==='pname'){ commit('pn'); doc.meta.panelTitle=t.value; refresh(); }
});
document.addEventListener('change', e=>{
  const t=e.target; if(t.id==='ps') return;
  if(t.matches('select[data-k]') && sel){ const r=find(sel); commit(sel+t.dataset.k); r.n.p[t.dataset.k]=t.value; refresh(); renderInspector(); }
});
document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase(); const typing = ['input','textarea','select'].includes(tag);
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(typing) return;
  if((e.key==='Delete'||e.key==='Backspace') && sel){ e.preventDefault(); del(sel); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='d' && sel){ e.preventDefault(); dup(sel); }
  else if(e.key==='Escape'){ select(null); $$('.modal.show').forEach(m=>m.classList.remove('show')); $('#themebox').classList.remove('show'); }
  else if(e.key==='ArrowUp' && sel && e.altKey){ e.preventDefault(); move(sel,-1); }
  else if(e.key==='ArrowDown' && sel && e.altKey){ e.preventDefault(); move(sel,1); }
});

/* =====================================================================
   Toolbar, templates, import/export
   ===================================================================== */
function build(tree, meta){ doc = {meta:Object.assign(meta0(),meta||{}), root: mk('Column',{gap:10,padding:0}, tree)}; sel=null; past=[]; future=[]; syncHistBtns(); renderAll(); }
const M = mk;
const TEMPLATES = {
  blank:{name:'空白面板',desc:'从零开始，把元素拖进来搭建。',make:()=>build([])},
  create:{name:'创建面板',desc:'提示词、风格、滑块，以及醒目的“创建”按钮。',make:()=>build([
    M('Card',{title:'新建作品',subtitle:'描述它、选择风格、生成',icon:'sparkle'},[
      M('Segmented',{items:'网格\n场景\n图像',value:'网格'}),
      M('TextInput',{placeholder:'描述你想要的内容…',multiline:true,min_lines:3,value:'黄昏时礁石小岛上的小灯塔'}),
      M('Slider',{label:'细节',value:.5,bind:'scene.my_props.detail'}),
      M('Stepper',{label:'变体',value:1,min:1,max:8}),
      M('Row',{gap:8},[M('Button',{text:'预览',icon:'eye',variant:'outline',flex:0}),M('Button',{text:'创建',icon:'sparkle',variant:'hero',cost:3,action:'create'})])])],{appId:'creator',tabName:'创建'})},
  render:{name:'渲染设置',desc:'直接绑定到 scene.render 的属性。',make:()=>build([
    M('Card',{title:'渲染',icon:'camera',collapsible:true,key:'card_render'},[
      M('Dropdown',{label:'渲染引擎',items:'BLENDER_EEVEE_NEXT\nCYCLES\nBLENDER_WORKBENCH',value:'CYCLES',bind:'scene.render.engine'}),
      M('Row',{gap:6},[M('NumberField',{label:'宽度',value:1920,bind:'scene.render.resolution_x'}),M('NumberField',{label:'高度',value:1080,bind:'scene.render.resolution_y'})]),
      M('Slider',{label:'分辨率 %',value:100,min:10,max:100,integer:true,unit:'%',bind:'scene.render.resolution_percentage'}),
      M('Switch',{text:'透明胶片',value:false,bind:'scene.render.film_transparent'}),
      M('FilePathField',{label:'输出',mode:'DIR',bind:'scene.render.filepath'})]),
    M('Button',{text:'渲染图像',icon:'play',variant:'hero',operator:'render.render'})],{appId:'render_tools',tabName:'渲染'})},
  dash:{name:'场景仪表盘',desc:'统计卡片、图表和表格。',make:()=>build([
    M('Heading',{title:'场景',subtitle:'实时概览',eyebrow:'仪表盘'}),
    M('Grid',{cols:2,gap:8},[M('StatTile',{label:'对象',value:'5',delta:'+2',icon:'cube'}),M('StatTile',{label:'顶点',value:'8',icon:'mesh'}),M('StatTile',{label:'帧',value:'24',icon:'play'}),M('StatTile',{label:'FPS',value:'60',delta:'-3',icon:'bolt'})]),
    M('Card',{title:'活动',icon:'chart'},[M('LineChart',{values:'1, 3, 2, 6, 5, 9, 8, 12',height:130})]),
    M('Table',{})],{appId:'scene_dash',tabName:'仪表盘'})},
  inspector:{name:'对象检查器',desc:'用标签页和 Prop() 控件检查当前对象。',make:()=>build([
    M('Tabs',{},[M('Tab',{label:'变换',icon:'cube'},[M('Prop',{target:'object.location'}),M('Prop',{target:'object.rotation_euler'}),M('Prop',{target:'object.scale'})]),M('Tab',{label:'外观',icon:'palette'},[M('Prop',{target:'object.color'}),M('Prop',{target:'object.hide_render'})])]),
    M('Row',{gap:6},[M('Button',{text:'平滑着色',icon:'sphere',operator:'object.shade_smooth'}),M('Button',{text:'删除',icon:'trash',variant:'danger',operator:'object.delete'})])],{appId:'inspector',tabName:'检查'})},
};
function openTemplates(){ $('#tpl').innerHTML = Object.entries(TEMPLATES).map(([k,t])=>`<button data-tpl="${k}"><b>${t.name}</b><span>${t.desc}</span></button>`).join(''); $('#m-tpl').classList.add('show'); }
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-tpl]'); if(b){ commit(); TEMPLATES[b.dataset.tpl].make(); $('#m-tpl').classList.remove('show'); toast('模板已载入'); }
  const mode=e.target.closest('#codebar [data-mode]'); if(mode){ codeMode=mode.dataset.mode; renderCode(); }
  if(e.target.closest('.modal') && e.target.classList.contains('modal')) e.target.classList.remove('show');
});
function download(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function init(){
  $('#palette-search').addEventListener('input', e=>renderPalette(e.target.value));
  $('#undo').onclick=undo; $('#redo').onclick=redo;
  $('#new').onclick=openTemplates;
  $('#copy').onclick=async()=>{ const raw=$('#code').dataset.raw; try{ await navigator.clipboard.writeText(raw); }catch(e){ const ta=document.createElement('textarea'); ta.value=raw; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } toast('已复制到剪贴板'); };
  $('#dl').onclick=()=>{ if(codeMode==='json') download('uzima_layout.json',$('#code').dataset.raw); else download(codeMode==='build'?'ui_build.py':'__init__.py',$('#code').dataset.raw); };
  $('#import').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const o=JSON.parse(t); if(!o.root) throw 0; commit(); doc=o; doc.meta=Object.assign(meta0(),doc.meta); let mx=0; walk(doc.root,n=>{const k=+String(n.id).slice(1); if(k>mx)mx=k;}); uid=mx+1; sel=null; renderAll(); toast('布局已导入'); }catch(err){ toast('不是有效的 Uzima 布局文件','error'); } }); e.target.value=''; };
  $('#clear').onclick=()=>{ if(!doc.root.c.length) return; commit(); doc.root.c=[]; sel=null; renderAll(); };
  $('#themebtn').onclick=()=>$('#themebox').classList.toggle('show');
  $('#g-grad').onclick=function(){ commit(); doc.meta.gradients=!doc.meta.gradients; this.classList.toggle('on',doc.meta.gradients); renderAll(); };
  $('#g-shad').onclick=function(){ commit(); doc.meta.shadows=!doc.meta.shadows; this.classList.toggle('on',doc.meta.shadows); renderAll(); };
  $$('.dev button').forEach(b=>b.onclick=()=>{ commit(); doc.meta.width=+b.dataset.w; renderAll(); $$('.dev button').forEach(x=>x.classList.toggle('on',x===b)); });
  $$('.tabs-h button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  $('#acc').addEventListener('input',()=>{});
  $('#sw').innerHTML=['#9fbd97','#7cc4a4','#6aa8e8','#b79cf2','#f08fb5','#e8b25a','#f0885a','#d4d8dc'].map(c=>`<i data-sw="${c}" style="background:${c}"></i>`).join('');
  const had = load();
  if(!had) TEMPLATES.create.make();
  renderPalette(); renderAll(); syncHistBtns();
  $('#g-grad').classList.toggle('on',doc.meta.gradients); $('#g-shad').classList.toggle('on',doc.meta.shadows); $('#acc').value=doc.meta.accent;
  $$('.dev button').forEach(x=>x.classList.toggle('on',+x.dataset.w===doc.meta.width));
}
window.UzimaGen = {get doc(){return doc;}, genCode, create, addTo, find, select, W, TEMPLATES, build, count};
document.addEventListener('DOMContentLoaded', init);
})();
</script></body></html>
